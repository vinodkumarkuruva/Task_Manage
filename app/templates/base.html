<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Task Manager{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <nav>
            <ul class="nav-links">
                <li><a href="{{ url_for('app.index') }}">Home</a></li>
                <li><a href="{{ url_for('app.register') }}">Register</a></li>
                <li><a href="{{ url_for('app.login') }}">Login</a></li>
                <li><a href="{{ url_for('app.dashboard') }}">Dashboard</a></li>
                <li><a href="{{ url_for('app.logout') }}">Logout</a></li>
            </ul>
        </nav>
    </header>
    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-messages">
            {% for category, message in messages %}
            <div class="alert {{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
